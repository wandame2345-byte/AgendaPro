<section id="agenda" class="section">

  <div class="top">
    <div>
      <h1>Agenda</h1>

      <div class="subtitle">
        Controle seus horários e atendimentos
      </div>
    </div>

    <button
      type="button"
      class="btn primary"
      onclick="openModal()"
    >
      + Novo agendamento
    </button>
  </div>

  <!-- Mantido escondido para o JavaScript funcionar -->
  <input
    type="hidden"
    id="agendaDate"
  >

  <div class="panel">
    <div
      class="slots"
      id="slots"
    ></div>
  </div>

  <br>

  <div class="panel">
    <h2>Agendamentos de hoje</h2>

    <div
      class="table-wrap"
      id="dayTable"
    ></div>
  </div>

  <br>

  <div class="panel">
    <h2>🔎 Consultar período</h2>

    <div class="filters">
      <input
        type="date"
        id="agendaFilterStart"
        aria-label="Data inicial"
      >

      <input
        type="date"
        id="agendaFilterEnd"
        aria-label="Data final"
      >

      <button
        type="button"
        class="btn primary"
        onclick="applyAgendaFilter()"
      >
        Consultar
      </button>

      <button
        type="button"
        class="btn secondary"
        onclick="clearAgendaFilter()"
      >
        Limpar
      </button>
    </div>

    <div
      class="report-grid"
      id="agendaFilterCards"
      style="display:none"
    >
      <div class="card">
        <div class="label">
          Faturamento no período
        </div>

        <div
          class="value"
          id="agendaFilterRevenue"
        >
          R$ 0,00
        </div>
      </div>

      <div class="card">
        <div class="label">
          Atendimentos
        </div>

        <div
          class="value"
          id="agendaFilterCount"
        >
          0
        </div>
      </div>

      <div class="card">
        <div class="label">
          Ticket médio
        </div>

        <div
          class="value"
          id="agendaFilterTicket"
        >
          R$ 0,00
        </div>
      </div>
    </div>

    <div
      class="table-wrap"
      id="agendaFilterTable"
      style="margin-top:14px"
    ></div>
  </div>

</section>
