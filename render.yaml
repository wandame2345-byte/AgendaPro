services:
  - type: web
    name: agendapro
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agendapro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador
      - key: FUNC_EMAIL
        sync: false
      - key: FUNC_PASSWORD
        sync: false
      - key: FUNC_NAME
        value: Funcionário
      - key: UPLOAD_DIR
        value: /app/uploads
    disk:
      name: agendapro-uploads
      mountPath: /app/uploads
      sizeGB: 1

databases:
  - name: agendapro-db
    plan: basic-256mb
    databaseName: agendapro
    user: agendapro
